<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED HORIZON MP3 PLAYER</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.player {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
    background:
        radial-gradient(circle at center, #351010 0%, #090909 40%, #030303 100%);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #700000;
    padding-bottom: 15px;
}

.logo {
    color: #ff2020;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
}

.status {
    color: #ff3333;
    font-size: 11px;
}

.art {
    width: 250px;
    height: 250px;
    margin: 35px auto 25px;
    border-radius: 50%;
    border: 3px solid #ff1515;
    box-shadow:
        0 0 15px #ff0000,
        0 0 40px #770000,
        inset 0 0 35px #ff0000;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle,
        #ff2222 0%,
        #660000 8%,
        #150000 25%,
        #050505 55%,
        #200000 70%,
        #050505 100%);
}

.art.playing {
    animation: spin 8s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.disc {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 2px solid #ff3333;
    box-shadow: 0 0 20px red;
    display: flex;
    align-items: center;
    justify-content: center;
}

.disc::after {
    content: "";
    width: 18px;
    height: 18px;
    background: #ff2222;
    border-radius: 50%;
    box-shadow: 0 0 12px red;
}

.song {
    text-align: center;
}

.song h2 {
    font-size: 21px;
    color: white;
    margin-bottom: 8px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.song p {
    color: #999;
    font-size: 13px;
}

.time {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 12px;
    margin-top: 20px;
}

input[type="range"] {
    width: 100%;
    accent-color: red;
    cursor: pointer;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 25px 0;
}

.btn {
    border: 1px solid #900000;
    background: #120000;
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
}

.btn:active {
    transform: scale(.92);
}

.play {
    width: 68px;
    height: 68px;
    background: #e00000;
    border: 2px solid #ff4444;
    box-shadow: 0 0 25px red;
    font-size: 25px;
}

.volume {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
}

.volume span {
    font-size: 18px;
}

.section {
    border: 1px solid #550000;
    background: rgba(20,0,0,.7);
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

.section-title {
    color: #ff3030;
    font-weight: bold;
    margin-bottom: 12px;
}

.file-btn,
.action {
    display: inline-block;
    background: #190000;
    color: #ff4444;
    border: 1px solid #850000;
    padding: 10px 12px;
    border-radius: 7px;
    margin: 4px;
    cursor: pointer;
    font-size: 13px;
}

.file-btn:hover,
.action:hover {
    background: #400000;
}

input[type="file"] {
    display: none;
}

.playlists {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
}

.playlist {
    padding: 8px 12px;
    border: 1px solid #660000;
    border-radius: 20px;
    background: #0c0000;
    color: #bbb;
    cursor: pointer;
}

.playlist.active {
    background: #800000;
    color: white;
    border-color: red;
}

.song-list {
    max-height: 250px;
    overflow-y: auto;
    margin-top: 10px;
}

.song-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    border-bottom: 1px solid #300000;
    cursor: pointer;
}

.song-item:hover {
    background: #220000;
}

.song-item.active {
    background: #500000;
    color: #ff5555;
}

.number {
    width: 25px;
    color: #777;
}

.song-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.small-delete {
    color: #ff4444;
    cursor: pointer;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
}

.footer {
    text-align: center;
    color: #555;
    font-size: 10px;
    margin-top: 25px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="player">

    <div class="header">
        <div class="logo">RED//MP3</div>
        <div class="status">● ONLINE</div>
    </div>

    <div class="art" id="art">
        <div class="disc"></div>
    </div>

    <div class="song">
        <h2 id="title">NO SONG SELECTED</h2>
        <p id="artist">ADD MP3 MUSIC</p>
    </div>

    <div class="time">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
    </div>

    <input type="range" id="progress" min="0" max="100" value="0">

    <div class="controls">
        <button class="btn" id="shuffleBtn">🔀</button>
        <button class="btn" id="prevBtn">⏮</button>
        <button class="btn play" id="playBtn">▶</button>
        <button class="btn" id="nextBtn">⏭</button>
        <button class="btn" id="repeatBtn">🔁</button>
    </div>

    <div class="volume">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>

    <audio id="audio"></audio>

    <!-- MUSIC -->
    <div class="section">

        <div class="section-title">MUSIC LIBRARY</div>

        <label class="file-btn">
            ＋ ADD MP3 SONGS
            <input type="file" id="fileInput" accept="audio/mpeg,audio/mp3,.mp3" multiple>
        </label>

        <div id="songList" class="song-list">
            <div class="empty">No songs added</div>
        </div>

    </div>

    <!-- PLAYLIST -->
    <div class="section">

        <div class="section-title">PLAYLISTS</div>

        <button class="action" id="newPlaylist">
            ＋ NEW PLAYLIST
        </button>

        <button class="action" id="deletePlaylist">
            🗑 DELETE
        </button>

        <div id="playlists" class="playlists"></div>

    </div>

    <!-- ACTIONS -->
    <div class="section">

        <div class="section-title">TOOLS</div>

        <button class="action" id="addToPlaylist">
            ＋ ADD TO PLAYLIST
        </button>

        <button class="action" id="exportBtn">
            💾 EXPORT
        </button>

        <label class="action">
            📥 IMPORT
            <input type="file" id="importInput" accept=".json">
        </label>

    </div>

    <div class="footer">
        RED//MP3 PLAYER
    </div>

</div>

<script>

let songs = [];
let currentIndex = -1;
let currentPlaylist = "All Songs";
let repeat = false;
let shuffle = false;

let playlists = {
    "All Songs": []
};

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const songList = document.getElementById("songList");
const playlistsBox = document.getElementById("playlists");
const art = document.getElementById("art");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");


// ===============================
// FORMAT TIME
// ===============================

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "00:00";
    }

    let min = Math.floor(seconds / 60);
    let sec = Math.floor(seconds % 60);

    return String(min).padStart(2, "0") + ":" +
           String(sec).padStart(2, "0");
}


// ===============================
// ADD SONGS
// ===============================

document.getElementById("fileInput").addEventListener("change", function() {

    const files = Array.from(this.files);

    files.forEach(file => {

        if (!file.type.startsWith("audio/") &&
            !file.name.toLowerCase().endsWith(".mp3")) {
            return;
        }

        const url = URL.createObjectURL(file);

        songs.push({
            id: Date.now() + Math.random(),
            name: file.name,
            file: file,
            url: url
        });

        playlists["All Songs"].push(songs.length - 1);
    });

    renderSongs();

    this.value = "";

});


// ===============================
// RENDER SONGS
// ===============================

function renderSongs() {

    songList.innerHTML = "";

    let indexes = [];

    if (currentPlaylist === "All Songs") {

        indexes = playlists["All Songs"];

    } else {

        indexes = playlists[currentPlaylist] || [];

    }

    if (indexes.length === 0) {

        songList.innerHTML =
            '<div class="empty">No songs in this playlist</div>';

        return;
    }

    indexes.forEach((songIndex, position) => {

        const song = songs[songIndex];

        if (!song) return;

        const item = document.createElement("div");

        item.className = "song-item";

        if (songIndex === currentIndex) {
            item.classList.add("active");
        }

        item.innerHTML = `
            <div class="number">${position + 1}</div>
            <div class="song-name">${escapeHTML(song.name)}</div>
            <div>▶</div>
        `;

        item.onclick = function() {
            playSong(songIndex);
        };

        songList.appendChild(item);

    });
}


// ===============================
// SECURITY
// ===============================

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// ===============================
// PLAY SONG
// ===============================

function playSong(index) {

    if (!songs[index]) return;

    currentIndex = index;

    const song = songs[index];

    audio.src = song.url;

    title.textContent =
        song.name.replace(/\.[^/.]+$/, "");

    artist.textContent = "LOCAL MUSIC";

    audio.play()
        .then(() => {

            playBtn.textContent = "⏸";

            art.classList.add("playing");

        })
        .catch(() => {

            alert("Unable to play this file. Please use an MP3 file.");

        });

    renderSongs();
}


// ===============================
// PLAY / PAUSE
// ===============================

playBtn.onclick = function() {

    if (!audio.src) {

        if (songs.length > 0) {

            playSong(0);

        } else {

            alert("First add an MP3 song.");

        }

        return;
    }

    if (audio.paused) {

        audio.play();

        playBtn.textContent = "⏸";

        art.classList.add("playing");

    } else {

        audio.pause();

        playBtn.textContent = "▶";

        art.classList.remove("playing");

    }

};


// ===============================
// NEXT
// ===============================

document.getElementById("nextBtn").onclick = function() {

    if (songs.length === 0) return;

    let list =
        currentPlaylist === "All Songs"
        ? playlists["All Songs"]
        : playlists[currentPlaylist] || [];

    if (list.length === 0) return;

    let position = list.indexOf(currentIndex);

    let nextPosition;

    if (shuffle) {

        nextPosition =
            Math.floor(Math.random() * list.length);

    } else {

        nextPosition = position + 1;

        if (nextPosition >= list.length) {
            nextPosition = 0;
        }

    }

    playSong(list[nextPosition]);

};


// ===============================
// PREVIOUS
// ===============================

document.getElementById("prevBtn").onclick = function() {

    if (songs.length === 0) return;

    let list =
        currentPlaylist === "All Songs"
        ? playlists["All Songs"]
        : playlists[currentPlaylist] || [];

    if (list.length === 0) return;

    let position = list.indexOf(currentIndex);

    position--;

    if (position < 0) {
        position = list.length - 1;
    }

    playSong(list[position]);

};


// ===============================
// AUDIO ENDED
// ===============================

audio.addEventListener("ended", function() {

    if (repeat) {

        audio.currentTime = 0;

        audio.play();

    } else {

        document.getElementById("nextBtn").click();

    }

});


// ===============================
// PROGRESS
// ===============================

audio.addEventListener("timeupdate", function() {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

    currentTime.textContent =
        formatTime(audio.currentTime);

});

audio.addEventListener("loadedmetadata", function() {

    duration.textContent =
        formatTime(audio.duration);

});

progress.oninput = function() {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

};


// ===============================
// VOLUME
// ===============================

volume.oninput = function() {

    audio.volume = volume.value;

};


// ===============================
// SHUFFLE
// ===============================

document.getElementById("shuffleBtn").onclick = function() {

    shuffle = !shuffle;

    this.style.background =
        shuffle ? "#800000" : "#120000";

};


// ===============================
// REPEAT
// ===============================

document.getElementById("repeatBtn").onclick = function() {

    repeat = !repeat;

    this.style.background =
        repeat ? "#800000" : "#120000";

};


// ===============================
// NEW PLAYLIST
// ===============================

document.getElementById("newPlaylist").onclick = function() {

    const name = prompt("Enter playlist name:");

    if (!name) return;

    const cleanName = name.trim();

    if (!cleanName) return;

    if (playlists[cleanName]) {

        alert("Playlist already exists.");

        return;
    }

    playlists[cleanName] = [];

    currentPlaylist = cleanName;

    renderPlaylists();

    renderSongs();

};


// ===============================
// DELETE PLAYLIST
// ===============================

document.getElementById("deletePlaylist").onclick = function() {

    if (currentPlaylist === "All Songs") {

        alert("All Songs cannot be deleted.");

        return;
    }

    if (!confirm("Delete playlist " + currentPlaylist + "?")) {
        return;
    }

    delete playlists[currentPlaylist];

    currentPlaylist = "All Songs";

    renderPlaylists();

    renderSongs();

};


// ===============================
// SHOW PLAYLISTS
// ===============================

function renderPlaylists() {

    playlistsBox.innerHTML = "";

    Object.keys(playlists).forEach(name => {

        const button = document.createElement("button");

        button.className = "playlist";

        if (name === currentPlaylist) {
            button.classList.add("active");
        }

        button.textContent = name;

        button.onclick = function() {

            currentPlaylist = name;

            renderPlaylists();

            renderSongs();

        };

        playlistsBox.appendChild(button);

    });

}


// ===============================
// ADD SONG TO PLAYLIST
// ===============================

document.getElementById("addToPlaylist").onclick = function() {

    if (currentPlaylist === "All Songs") {

        alert("Create a playlist first.");

        return;
    }

    if (currentIndex < 0) {

        alert("Select a song first.");

        return;
    }

    if (!playlists[currentPlaylist].includes(currentIndex)) {

        playlists[currentPlaylist].push(currentIndex);

    }

    renderSongs();

    alert("Song added to " + currentPlaylist);

};


// ===============================
// EXPORT
// ===============================

document.getElementById("exportBtn").onclick = function() {

    const data = JSON.stringify(playlists, null, 2);

    const blob = new Blob(
        [data],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download = "red-mp3-playlists.json";

    a.click();

    URL.revokeObjectURL(url);

};


// ===============================
// IMPORT
// ===============================

document.getElementById("importInput").addEventListener(
    "change",
    function() {

        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {

            try {

                const imported =
                    JSON.parse(e.target.result);

                if (typeof imported !== "object") {
                    throw new Error();
                }

                Object.keys(imported).forEach(name => {

                    if (!Array.isArray(imported[name])) {
                        return;
                    }

                    playlists[name] = imported[name]
                        .filter(index =>
                            Number.isInteger(index) &&
                            songs[index]
                        );

                });

                currentPlaylist = "All Songs";

                renderPlaylists();

                renderSongs();

                alert("Playlist imported successfully.");

            } catch {

                alert("Invalid playlist file.");

            }

        };

        reader.readAsText(file);

        this.value = "";

    }
);


// ===============================
// INITIAL DISPLAY
// ===============================

renderPlaylists();
renderSongs();

</script>

</body>
</html>
